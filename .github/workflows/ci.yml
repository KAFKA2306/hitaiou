name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -v
      - name: HTTP smoke test
        run: |
          python server.py >server.log 2>&1 &
          pid=$!
          trap 'kill "$pid"' EXIT
          for _ in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8001/ >/tmp/hitaiou-root.json; then
              python -c "import json; from pathlib import Path; payload=json.loads(Path('/tmp/hitaiou-root.json').read_text()); assert payload['status']=='running'; assert payload['endpoints'][0]['path']=='/api/demand-metrics'"
              exit 0
            fi
            sleep 1
          done
          cat server.log
          exit 1
      - run: git diff --exit-code
